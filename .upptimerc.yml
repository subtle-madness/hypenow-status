# 하입나우 서비스 상태 페이지 설정 — https://status.hypenow.io
# 점검은 GitHub Actions가 5분마다 바깥에서 접속해 확인한다(우리 서버와 독립).
# 설정 문서: https://upptime.js.org/docs/configuration
owner: subtle-madness
repo: hypenow-status

# 장애 이슈 담당자(자동 장애 이슈가 열리면 배정)
assignees:
  - chlwoomin

sites:
  # 고객이 여는 웹 화면(Vercel)
  - name: 웹사이트
    slug: website
    url: https://www.hypenow.io
    maxResponseTime: 5000
  # 서버 프로그램 생존 확인 — 데이터베이스는 보지 않는다(was HealthController)
  - name: 서비스 서버
    slug: api
    url: https://api.hypenow.io/health
    maxResponseTime: 5000
    __dangerous__body_down_if_text_missing: '"status":"ok"'
  # 로그인 없이 열리는 랜딩 통계 — 서버에서 데이터베이스까지 읽히는지 확인
  - name: 데이터 조회
    slug: data
    url: https://api.hypenow.io/v1/stats
    maxResponseTime: 5000
    __dangerous__body_down_if_text_missing: '"success":true'

# 저장소 설명·토픽·홈페이지 자동 수정 끄기(직접 관리)
skipDescriptionUpdate: true
skipTopicsUpdate: true

status-website:
  cname: status.hypenow.io
  logoUrl: https://www.hypenow.io/android-chrome-192x192.png
  favicon: https://www.hypenow.io/android-chrome-192x192.png
  faviconSvg: https://www.hypenow.io/android-chrome-192x192.png
  name: 하입나우 서비스 상태
  introTitle: "**하입나우** 서비스 상태"
  introMessage: 하입나우의 주요 기능이 정상인지 5분마다 확인해 보여드려요. 장애가 생기면 이곳에 상황과 해결 소식을 올려요.
  theme: light
  # 브랜드 색 — 테마 CSS보다 뒤에 적용되도록 선택자 우선순위를 높인다
  customHeadHtml: >-
    <meta name="theme-color" content="#ec4899" />
    <style>
    html:root {
      --body-background-color: #fdf2f8;
      --body-text-color: #1f2937;
      --nav-border-bottom-color: #fbcfe8;
      --nav-current-border-bottom-color: #ec4899;
      --card-border-color: #fbcfe8;
      --error-button-border-color: #d61f7f;
      --error-button-background-color: #ec4899;
      --submit-button-border-color: #d61f7f;
      --submit-button-background-color: #ec4899;
    }
    a { color: #d61f7f; }
    </style>
  navbar:
    - title: 서비스 상태
      href: /
    - title: 하입나우 바로가기
      href: https://www.hypenow.io

