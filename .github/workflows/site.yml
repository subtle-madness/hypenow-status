# 상태 페이지 정적 생성·배포 (Upptime 기본 화면 빌드를 대체)
# 브라우저가 GitHub API를 부르지 않도록, 이슈·점검 기록을 읽어 완성된 HTML을 gh-pages에 올린다.
# 스크립트: .github/scripts/build-site.mjs
name: Static Site CI
on:
  # GITHUB_TOKEN이 만든 커밋·이슈는 새 워크플로를 깨우지 못하므로 workflow_run으로 따라간다
  workflow_run:
    workflows: ["Uptime CI", "Response Time CI", "Summary CI", "Graphs CI", "Setup CI"]
    types: [completed]
  # 사람이 올리는 장애·점검 공지
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled, deleted]
  issue_comment:
    types: [created, edited, deleted]
  push:
    branches: [main]
    paths:
      - ".github/scripts/**"
      - ".github/workflows/site.yml"
      - ".upptimerc.yml"
  # 안전망
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
# 겹치는 실행은 최신 것만 남긴다
concurrency:
  group: ${{ github.repository }}-status-site
  cancel-in-progress: true
# 조직 기본값이 읽기 전용이라 필요한 권한을 워크플로에서 직접 요청한다
permissions:
  contents: write
  issues: read
  actions: read

jobs:
  build:
    name: Build and deploy site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
      - name: Self test
        run: node --test .github/scripts/build-site.test.mjs
      - name: Build site
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node .github/scripts/build-site.mjs
      - name: Deploy to gh-pages (orphan, force push)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "chore: 상태 페이지 갱신 $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -q --force origin gh-pages
